spring.application.name=processing-service
server.port=8080
spring.jackson.generator.write-bigdecimal-as-plain=true

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/crypto_market_pulse}
spring.datasource.username=${DB_USERNAME:crypto_user}
spring.datasource.password=${DB_PASSWORD:crypto_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:market-processing-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.cryptomarketpulse.dto
spring.kafka.consumer.properties.spring.json.value.default.type=com.cryptomarketpulse.dto.TradeEvent
spring.kafka.listener.ack-mode=record
app.kafka.market-trades-topic=${APP_KAFKA_MARKET_TRADES_TOPIC:market-trades}
