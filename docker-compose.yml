services:
  ingestion-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: crypto-market-pulse-ingestion:latest
    container_name: crypto-market-pulse-ingestion
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ingestion
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_KAFKA_MARKET_TRADES_TOPIC: market-trades
      COINBASE_WS_ENABLED: "true"
    restart: unless-stopped
    networks:
      - crypto-net

  processing-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: crypto-market-pulse-processing:latest
    container_name: crypto-market-pulse-processing
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: processing
      DB_URL: jdbc:postgresql://postgres:5432/crypto_market_pulse
      DB_USERNAME: crypto_user
      DB_PASSWORD: crypto_password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP: market-processing-service
      APP_KAFKA_MARKET_TRADES_TOPIC: market-trades
      COINBASE_WS_ENABLED: "false"
    restart: unless-stopped
    networks:
      - crypto-net

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: crypto-market-pulse-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - crypto-net

  postgres:
    image: postgres:16
    container_name: crypto-market-pulse-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: crypto_market_pulse
      POSTGRES_USER: crypto_user
      POSTGRES_PASSWORD: crypto_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto_user -d crypto_market_pulse"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - crypto-net

volumes:
  pgdata:

networks:
  crypto-net:
    driver: bridge
