services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: crypto-market-pulse-app:latest
    container_name: crypto-market-pulse-app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/crypto_market_pulse
      DB_USERNAME: crypto_user
      DB_PASSWORD: crypto_password
      COINBASE_WS_ENABLED: "true"
    restart: unless-stopped
    networks:
      - crypto-net

  postgres:
    image: postgres:16
    container_name: crypto-market-pulse-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: crypto_market_pulse
      POSTGRES_USER: crypto_user
      POSTGRES_PASSWORD: crypto_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto_user -d crypto_market_pulse"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - crypto-net

volumes:
  pgdata:

networks:
  crypto-net:
    driver: bridge
