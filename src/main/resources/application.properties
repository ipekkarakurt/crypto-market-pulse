spring.application.name=crypto-market-pulse
server.port=8080
spring.jackson.generator.write-bigdecimal-as-plain=true

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/crypto_market_pulse}
spring.datasource.username=${DB_USERNAME:crypto_user}
spring.datasource.password=${DB_PASSWORD:crypto_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
